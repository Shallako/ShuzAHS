plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

ext {
    testcontainersVersion = '1.20.4'
    awaitilityVersion = '4.2.1'
}

dependencies {
    // Project dependencies
    implementation project(':ahs-common')
    implementation project(':ahs-domain')
    implementation project(':ahs-proto')
    
    // Hazelcast (Jet embedded) dependencies
    implementation "com.hazelcast:hazelcast:5.6.0"
    implementation "com.hazelcast.jet:hazelcast-jet-kafka:5.6.0"
    
    // Jackson for JSON serialization (fallback path)
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Protobuf runtime
    implementation 'com.google.protobuf:protobuf-java:3.25.3'

    // Testing
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
    testImplementation "org.testcontainers:kafka:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.awaitility:awaitility:${awaitilityVersion}"
    testImplementation "org.apache.kafka:kafka-clients:${kafkaVersion}"
}

application {
    mainClass = 'com.shoulico.ahs.telemetry.JetTelemetryProcessorJob'
}

// Create a fat JAR suitable for running the embedded Jet job
shadowJar {
    archiveClassifier.set('all')
}

// Exclude legacy Flink implementations and tests
sourceSets {
    main {
        java {
            exclude 'com/shoulico/ahs/telemetry/TelemetryProcessorJob.java'
            exclude 'com/shoulico/ahs/telemetry/function/**'
        }
    }
    test {
        java {
            exclude 'com/shoulico/ahs/telemetry/TelemetryAlertFunctionTest.java'
            exclude 'com/shoulico/ahs/telemetry/function/**'
            exclude 'com/shoulico/ahs/telemetry/integration/EndToEndIntegrationTest.java'
            exclude 'com/shoulico/ahs/telemetry/integration/KafkaIntegrationTest.java'
            exclude 'com/shoulico/ahs/telemetry/integration/TelemetryProcessorIntegrationTest.java'
        }
    }
}

test {
    useJUnitPlatform()
    exclude '**/*IT.class', '**/*IT$*.class'
}

tasks.register('integrationTest', Test) {
    description = 'Runs Kafka integration tests with Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IT.class', '**/*IT$*.class'
    shouldRunAfter test
    environment 'DOCKER_API_VERSION', '1.44'
    systemProperty 'api.version', '1.44'
    systemProperty 'docker.client.api.version', '1.44'
}

check.dependsOn integrationTest

task runTelemetryProcessor(type: JavaExec) {
    group = 'application'
    description = 'Run the Hazelcast Jet Telemetry Processor Job'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.shoulico.ahs.telemetry.JetTelemetryProcessorJob'
}
